[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-ts-asr"
version = "0.1.0"
description = "Reproducible inference and training code for Unified Target-Speaker ASR"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {text = "Apache-2.0"}
dependencies = [
  "hydra-core>=1.3.2",
  "huggingface-hub",
  "jieba",
  "jaconv",
  "jamo",
  "kaldiio>=2.17.0",
  "librosa",
  "modelscope",
  "numpy",
  "omegaconf>=2.0",
  "opencc-python-reimplemented",
  "PyYAML>=5.1.2",
  "rapidfuzz>=3.0.0",
  "regex",
  "requests",
  "safetensors",
  "scipy>=1.4.1",
  "sentencepiece",
  "soundfile>=0.12.1",
  "tensorboardX",
  "tiktoken",
  "torch>=2.1",
  "torchaudio>=2.1",
  "torch-complex",
  "tqdm",
  "transformers",
  "websockets>=10.4",
]

[project.optional-dependencies]
train = ["deepspeed>=0.14", "torch-optimizer"]
test = ["pytest>=8"]

[project.scripts]
unified-ts-asr-infer = "scripts.infer:main"
unified-ts-asr-evaluate = "scripts.evaluate:main"
unified-ts-asr-train = "scripts.train:main"
unified-ts-asr-extract-embeddings = "scripts.extract_embeddings:main"
unified-ts-asr-make-speaker-map = "scripts.make_speaker_map:main"

[tool.setuptools.packages.find]
include = ["funasr*", "unified_ts_asr*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
